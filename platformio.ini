; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:ATmega128]
platform = atmelavr
board = atmega128
src_filter =
    +<core/*>
    +<hardware/atmega128/cpu/*>
    +<hardware/atmega128/drivers/*>
    +<hardware/atmega128/targets/smoluksB6/*>
    +<hardware/atmega128/generic/300W/*>
    -<.git/>
build_flags =
    -I CoIDE/Version.h
    -I src/core
    -I src/core/calibration 
    -I src/core/drivers 
    -I src/core/helper 
    -I src/core/menus 
    -I src/core/screens 
    -I src/core/strategy 
    -I src/core/strings  
    -I src/hardware/atmega128 
    -I src/hardware/atmega128/cpu
    -I src/hardware/atmega128/drivers
    -I src/hardware/atmega128/generic/300W
    -I src/hardware/atmega128/targets/smoluksB6
upload_protocol = custom
upload_port = usb
upload_flags =
    -C
    ; use "tool-avrdude-megaavr" for the atmelmegaavr platform
    $PROJECT_PACKAGES_DIR/tool-avrdude/avrdude.conf
    -p
    $BOARD_MCU
    -P
    $UPLOAD_PORT
    -c
    usbasp
upload_command = avrdude $UPLOAD_FLAGS -U flash:w:$SOURCE:i
